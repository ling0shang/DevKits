<body>
    <div class="app-container">
        <!-- 左侧菜单 -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-tools"></i> DevToolKits
            </div>
            <nav class="tool-nav">
                <ul>
                    <!-- 一级菜单选项（无下拉） -->
                    <li data-tool="encoding" class="active">
                        <i class="fas fa-exchange-alt"></i> 字符编码转换
                    </li>
                    
                    <!-- 多个一级菜单 -->
                    <li data-tool="base64">

                            <span>文本工具</span>
                            <i class="fas fa-chevron-down arrow"></i>
                        </div>
                        <!-- 二级菜单 -->
                        <ul class="submenu">
                            <li data-tool="trim"><i class="fas fa-eraser"></i> 文本去空白</li>
                            <li data-tool="base64"><i class="fas fa-lock"></i> Base64</li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="footer-note">
                <i class="fas fa-shield-alt"></i> 本地处理 · 隐私安全
            </div>
        </aside>

        <!-- 右侧内容区，动态渲染工具 -->
        <main class="content-area" id="dynamic-content">
            <div class="loading-placeholder">
                <i class="fas fa-spinner fa-pulse"></i> 加载工具...
            </div>
        </main>
    </div>

    <!-- 全局 JS 模块 -->
    <script src="js/core.js"></script>
    <script src="js/main.js"></script>
